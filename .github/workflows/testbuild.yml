name: Test Build (Windows)

# 仅手动触发，只构建 Windows 包并上传为 Actions 产物（Artifact），
# 不会创建 tag、不会发布 Release。用于本地测试验证。

on:
  workflow_dispatch:

env:
  APP_NAME: LYEFI
  FLUTTER_VERSION: '3.41.9'

concurrency:
  group: testbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build · Windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: x64

      - run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Patch permission_handler_windows (MSVC coroutine compat)
        shell: pwsh
        run: |
          $hosted = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
          $dirs   = Get-ChildItem -Path $hosted -Filter "permission_handler_windows*" -Directory -ErrorAction SilentlyContinue
          foreach ($dir in $dirs) {
            $cmake = Join-Path $dir.FullName "windows\CMakeLists.txt"
            if (Test-Path $cmake) {
              $txt = Get-Content $cmake -Raw
              if ($txt -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
                Add-Content -Path $cmake -Value "`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
              }
            }
          }

      - name: Build
        shell: bash
        run: flutter build windows --release

      - name: Package (Windows zip)
        shell: pwsh
        run: |
          Copy-Item -Path "docs\dll\*.dll" -Destination "build/windows/x64/runner/Release" -Force
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{ env.APP_NAME }}-Windows-x64-test.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x64-test
          path: ${{ env.APP_NAME }}-Windows-x64-test.zip
          retention-days: 14
